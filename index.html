<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>AR6</title>
  <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@6.1.1/dist/aframe-extras.min.js"></script>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #000;
      touch-action: none; /* ブラウザ標準のスクロールや引っ張りリフレッシュを禁止 */
    }
    /* カメラ映像（一番奥に画面いっぱいで表示） */
    #camera-video {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 0;
    }
    /* 3Dモデルを描くシーン（カメラ映像の手前・背景は透明） */
    a-scene {
      position: fixed !important;
      top: 0;
      left: 0;
      width: 100% !important;
      height: 100% !important;
      z-index: 1;
    }
    #status {
      position: fixed;
      top: 16px;
      left: 16px;
      right: 130px;
      color: white;
      font-size: 13px;
      text-shadow: 0 1px 2px rgba(0,0,0,0.8);
      z-index: 1000;
      pointer-events: none;
    }
    /* 1本指の動作切り替えボタン */
    #mode-btn {
      position: fixed;
      top: 16px;
      right: 16px;
      padding: 8px 14px;
      font-size: 14px;
      background-color: rgba(0,0,0,0.5);
      color: white;
      border: 1px solid rgba(255,255,255,0.6);
      border-radius: 20px;
      cursor: pointer;
      z-index: 1000;
    }
    /* 撮影ボタンのスタイル */
    #snap-btn {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      padding: 12px 24px;
      font-size: 16px;
      background-color: #ff69b4;
      color: white;
      border: none;
      border-radius: 25px;
      cursor: pointer;
      z-index: 1000;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
      font-weight: bold;
    }
    #snap-btn:active {
      background-color: #ff1493;
    }
    /* 撮影した写真のプレビュー画面 */
    #preview {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.92);
      z-index: 2000;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 16px;
      box-sizing: border-box;
    }
    #preview.show { display: flex; }
    #preview img {
      max-width: 100%;
      max-height: 70vh;
      border-radius: 8px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.5);
    }
    #preview p {
      color: white;
      font-size: 13px;
      margin: 0;
      text-align: center;
    }
    #preview .btn-row { display: flex; gap: 12px; }
    #preview button {
      padding: 12px 24px;
      font-size: 16px;
      border: none;
      border-radius: 25px;
      cursor: pointer;
      font-weight: bold;
      color: white;
      background-color: #ff69b4;
    }
    #preview button.secondary { background-color: #666; }
  </style>
</head>
<body>

  <video id="camera-video" playsinline muted autoplay></video>
  <div id="status"></div>
  <button id="mode-btn">1本指：移動</button>
  <button id="snap-btn">写真を撮る</button>

  <div id="preview">
    <img id="preview-img" alt="撮影した写真">
    <p>「保存」を押すか、画像を長押しして保存してください</p>
    <div class="btn-row">
      <button id="save-btn">保存</button>
      <button id="close-btn" class="secondary">閉じる</button>
    </div>
  </div>

  <a-scene embedded vr-mode-ui="enabled: false"
           device-orientation-permission-ui="enabled: false"
           renderer="alpha: true; antialias: true; precision: high; colorManagement: true">
    <a-assets>
      <a-asset-item id="blossom-model" src="pink-blossom.glb"></a-asset-item>
    </a-assets>

    <!-- 3Dモデル（モデル内のアニメーションを繰り返し再生） -->
    <a-entity id="ar-object"
              gltf-model="#blossom-model"
              animation-mixer="loop: repeat"
              position="0 -1.2 -5"
              rotation="0 0 0"
              scale="1 1 1"></a-entity>

    <!-- モデルを照らすライト -->
    <a-entity light="type: ambient; color: #ffffff; intensity: 0.8"></a-entity>
    <a-entity light="type: directional; color: #ffffff; intensity: 0.6" position="1 3 2"></a-entity>

    <a-entity camera look-controls="enabled: false" wasd-controls="enabled: false"></a-entity>
  </a-scene>

<script>
// ==========================================
// 1. 指操作（1本：移動または回転（ボタンで切替）/ 2本：拡大縮小＋移動 / 3本：移動）
// ==========================================
const arObject = document.getElementById('ar-object');
const sceneEl = document.querySelector('a-scene');
const OBJECT_Z = -5;      // モデルを置く奥行き（position の3つ目の値と合わせる）
const ROTATE_SPEED = 0.5; // 1本指で動かした1pxあたりの回転角（度）

// 指を置いた時点の状態（指の本数が変わるたびに取り直す）
let gesture = null;

// 1本指の動作：'move'（移動）か 'rotate'（回転）。ボタンで切り替え
let oneFingerMode = 'move';
const modeBtn = document.getElementById('mode-btn');
modeBtn.addEventListener('click', function() {
  oneFingerMode = oneFingerMode === 'move' ? 'rotate' : 'move';
  modeBtn.textContent = oneFingerMode === 'move' ? '1本指：移動' : '1本指：回転';
});

// 画面上の1pxが、モデルの位置（奥行き OBJECT_Z）で何単位に当たるかを計算
// → 指の動きとモデルの動きがぴったり合う
function unitsPerPixel() {
  const cam = sceneEl.camera;
  const fov = cam ? cam.fov : 80;
  const visibleHeight = 2 * Math.abs(OBJECT_Z) * Math.tan((fov / 2) * Math.PI / 180);
  return visibleHeight / window.innerHeight;
}

function centroid(touches) {
  let x = 0, y = 0;
  for (const t of touches) { x += t.clientX; y += t.clientY; }
  return { x: x / touches.length, y: y / touches.length };
}

function distance(touches) {
  return Math.hypot(
    touches[0].clientX - touches[1].clientX,
    touches[0].clientY - touches[1].clientY
  );
}

// 今の指の位置とモデルの状態を「基準」として記録する
function startGesture(touches) {
  if (touches.length === 0) { gesture = null; return; }
  const rot = arObject.getAttribute('rotation') || { x: 0, y: 0, z: 0 };
  const pos = arObject.getAttribute('position') || { x: 0, y: 0, z: OBJECT_Z };
  const scl = arObject.getAttribute('scale') || { x: 1, y: 1, z: 1 };
  gesture = {
    count: touches.length,
    center: centroid(touches),
    dist: touches.length >= 2 ? distance(touches) : 0,
    rotX: rot.x, rotY: rot.y,
    posX: pos.x, posY: pos.y,
    scale: scl.x
  };
}

window.addEventListener('touchstart', function(e) {
  if (e.target.tagName === 'BUTTON') return; // ボタンはそのまま押せるようにする
  if (e.target.closest('#preview')) return; // プレビュー画面では画像の長押しなどをそのまま使えるようにする
  e.preventDefault();
  startGesture(e.touches); // 指が増えるたびに基準を取り直す
}, { passive: false });

window.addEventListener('touchmove', function(e) {
  if (e.target.closest('#preview')) return;
  e.preventDefault(); // ブラウザ標準のスクロールや拡大を止める
  if (!gesture || e.touches.length !== gesture.count) {
    startGesture(e.touches);
    return;
  }

  const c = centroid(e.touches);
  const dx = c.x - gesture.center.x;
  const dy = c.y - gesture.center.y;

  if (gesture.count === 1 && oneFingerMode === 'rotate') {
    // 1本指（回転モード）：左右の動きでY軸回転、上下の動きでX軸回転
    const newRotX = gesture.rotX + dy * ROTATE_SPEED;
    const newRotY = gesture.rotY + dx * ROTATE_SPEED;
    arObject.setAttribute('rotation', `${newRotX} ${newRotY} 0`);
    return;
  }

  // 1本指（移動モード）・2本・3本指：指の中心の動きに合わせてモデルを移動（指とぴったり同じ量）
  const k = unitsPerPixel();
  const newX = gesture.posX + dx * k;
  const newY = gesture.posY - dy * k;
  arObject.setAttribute('position', `${newX} ${newY} ${OBJECT_Z}`);

  if (gesture.count === 2 && gesture.dist > 0) {
    // 2本指はさらに、指の間隔で拡大縮小
    const factor = distance(e.touches) / gesture.dist;
    const newScale = Math.max(0.1, Math.min(5.0, gesture.scale * factor));
    arObject.setAttribute('scale', `${newScale} ${newScale} ${newScale}`);
  }
}, { passive: false });

window.addEventListener('touchend', function(e) {
  startGesture(e.touches); // 指が減っても、残った指の位置から続けられるようにする
});
window.addEventListener('touchcancel', function(e) {
  startGesture(e.touches);
});

// ==========================================
// 2. カメラ映像の起動（背面カメラ）
// ==========================================
const video = document.getElementById('camera-video');
const statusEl = document.getElementById('status');

(async () => {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'environment', width: { ideal: 1920 }, height: { ideal: 1080 } },
      audio: false
    });
    video.srcObject = stream;
    await video.play();
  } catch (e) {
    statusEl.textContent = 'カメラを使用できません。ブラウザのカメラ許可を確認してください。';
  }
})();

// ==========================================
// 3. 写真撮影（カメラ映像＋3Dモデルを合成 → プレビュー → 保存）
// ==========================================
const previewEl = document.getElementById('preview');
const previewImg = document.getElementById('preview-img');
let capturedDataUrl = null;

document.getElementById('snap-btn').addEventListener('click', function() {
  const scene = document.querySelector('a-scene');
  if (!scene || !scene.canvas || !scene.renderer) {
    alert('AR機能の読み込み中です。数秒待ってからもう一度押してください。');
    return;
  }

  // 3Dモデルのキャンバスは画面と同じ縦横比なので、そのサイズで合成する
  const mergeCanvas = document.createElement('canvas');
  const width = scene.canvas.width;
  const height = scene.canvas.height;
  mergeCanvas.width = width;
  mergeCanvas.height = height;
  const ctx = mergeCanvas.getContext('2d');

  // 1) カメラ映像を画面と同じ見え方（object-fit: cover）で描く
  const vw = video.videoWidth, vh = video.videoHeight;
  if (vw && vh) {
    const scale = Math.max(width / vw, height / vh);
    const dw = vw * scale, dh = vh * scale;
    ctx.drawImage(video, (width - dw) / 2, (height - dh) / 2, dw, dh);
  }

  // 2) 3Dモデルを描き直してから重ねる
  scene.renderer.render(scene.object3D, scene.camera);
  ctx.drawImage(scene.canvas, 0, 0, width, height);

  try {
    capturedDataUrl = mergeCanvas.toDataURL('image/png');
  } catch (e) {
    alert('写真を作成できませんでした。スマートフォンのスクリーンショット機能で撮影してください。');
    return;
  }
  previewImg.src = capturedDataUrl;
  previewEl.classList.add('show');
});

document.getElementById('close-btn').addEventListener('click', function() {
  previewEl.classList.remove('show');
});

// data URL → Blob（保存・共有用）
function dataUrlToBlob(dataUrl) {
  const [head, body] = dataUrl.split(',');
  const mime = head.match(/:(.*?);/)[1];
  const bin = atob(body);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new Blob([bytes], { type: mime });
}

document.getElementById('save-btn').addEventListener('click', async function() {
  if (!capturedDataUrl) return;
  const fileName = 'ar-photo_' + Date.now() + '.png';
  const blob = dataUrlToBlob(capturedDataUrl);
  const file = new File([blob], fileName, { type: 'image/png' });

  // iPhone / iPad / Android：共有シートを開き「画像を保存」で写真アプリに保存できる
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try {
      await navigator.share({ files: [file] });
      return;
    } catch (e) {
      if (e && e.name === 'AbortError') return; // ユーザーがキャンセルした
    }
  }

  // パソコンなど：ファイルとしてダウンロード
  try {
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.download = fileName;
    link.href = url;
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    setTimeout(() => URL.revokeObjectURL(url), 10000);
  } catch (e) {
    alert('自動保存ができない環境です。画像を長押しして「写真に追加」を選んでください。');
  }
});
</script>
</body>
</html>
